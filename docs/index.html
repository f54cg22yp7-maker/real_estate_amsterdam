<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pand</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pand">
<meta name="theme-color" content="#F6F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="system")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon-192.png" alt="" class="logo"><span>Pand</span><span class="count" id="count"></span></div>
  <button class="me" id="me-btn" aria-label="Profile and settings"><img id="me-avatar" src="img/avatar-davit.png" alt=""><span id="me-name">Davit</span></button>
</header>

<main id="main">
  <section id="view-swipe" class="view active">
    <div class="deck" id="deck"></div>
    <div class="actions" id="actions">
      <button class="btn undo" id="btn-undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn no" id="btn-no" aria-label="Pass"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="btn super" id="btn-super" aria-label="Super like — request a viewing now"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9L22 9.5l-5.4 4.9L18 22l-6-3.6L6 22l1.4-7.6L2 9.5l7.1-.6z"/></svg></button>
      <button class="btn yes" id="btn-yes" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.6 4.5 7.2 4.5c2 0 3.4 1.1 4.8 2.7 1.4-1.6 2.8-2.7 4.8-2.7 3.6 0 5.7 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg></button>
      <button class="btn info" id="btn-info" aria-label="Details"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
    </div>
  </section>

  <section id="view-saved" class="view">
    <div class="segbar" id="saved-seg">
      <button data-seg="likes" class="active">Likes <b id="n-likes"></b></button>
      <button data-seg="matches">Matches <b id="n-matches"></b></button>
      <button data-seg="passed">Passed</button>
      <button data-seg="archived">Archived <b id="n-archived"></b></button>
    </div>
    <div class="list" id="saved-list"></div>
  </section>

  <section id="view-viewings" class="view"><div class="list" id="viewings-list"></div></section>

  <section id="view-map" class="view">
    <div id="bigmap"></div>
    <div class="legend"><span><i class="dot match"></i>Match</span><span><i class="dot mine"></i>You</span><span><i class="dot theirs"></i>Them</span><span><i class="dot open"></i>New</span></div>
    <div id="peek" class="peek" hidden></div>
  </section>
</main>

<nav class="tabs">
  <button data-view="swipe" class="active"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="M2 8v8M22 8v8"/></svg><span>Swipe</span></button>
  <button data-view="saved"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.6 4.5 7.2 4.5c2 0 3.4 1.1 4.8 2.7 1.4-1.6 2.8-2.7 4.8-2.7 3.6 0 5.7 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span>Saved</span></button>
  <button data-view="viewings"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Viewings</span><b id="n-viewings"></b></button>
  <button data-view="map"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg><span>Map</span></button>
</nav>

<!-- Listing detail -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-head"><button class="close" data-close="sheet" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sheet-title" id="sheet-title"></div><div class="spacer"></div></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<!-- Viewing evaluation -->
<div id="eval" class="sheet" hidden>
  <div class="sheet-head"><button class="close" data-close="eval" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sheet-title" id="eval-title"></div><div class="saved-hint" id="eval-saved"></div></div>
  <div class="sheet-body" id="eval-body"></div>
</div>

<!-- Weekly pick -->
<div id="weekly" class="sheet" hidden>
  <div class="sheet-head"><button class="close" data-close="weekly" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sheet-title">Weekly pick</div><div class="spacer"></div></div>
  <div class="sheet-body" id="weekly-body"></div>
</div>

<!-- Profile & settings -->
<div id="profile" class="sheet" hidden>
  <div class="sheet-head"><button class="close" data-close="profile" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sheet-title">You</div><div class="spacer"></div></div>
  <div class="sheet-body" id="profile-body"></div>
</div>

<!-- Quick status change (revealed by swiping a list row) -->
<div id="statusmenu" class="sheet" hidden>
  <div class="sheet-head"><button class="close" data-close="statusmenu" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sheet-title">Change status</div><div class="spacer"></div></div>
  <div class="sheet-body" id="statusmenu-body"></div>
</div>

<!-- Preferences questionnaire -->
<div id="prefs" class="sheet" hidden>
  <div class="sheet-head"><button class="close" data-close="prefs" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="sheet-title">What fits you</div><div class="saved-hint" id="prefs-saved"></div></div>
  <div class="sheet-body" id="prefs-body"></div>
</div>

<!-- Full-screen photos -->
<div id="lightbox" class="lightbox" hidden><div class="lb-count" id="lb-count"></div><button class="lb-close" data-lb-close="1" aria-label="Close">&#x2715;</button><div class="lb-track" id="lb-track"></div></div>

<!-- Sign in -->
<div id="auth" class="sheet auth" hidden><div class="sheet-body" id="auth-body"></div></div>

<div id="toast" class="toast" hidden></div>
<input type="file" id="photo-input" accept="image/*" capture="environment" hidden>

<script src="vendor/supabase.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="config.js"></script>
<script src="areas.js"></script>
<script src="affinity.js"></script>
<script src="app.js"></script>
</body>
</html>
