name: Check listings sheet

# Diagnostic: prints the Google Sheet's column layout (names and value shapes, never cell contents).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - run: python3 pipeline/sheet.py peek
