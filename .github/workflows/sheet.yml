name: Import listings sheet

# Manual run of the Google Sheet import (the scheduled job in refresh.yml also runs it).
on:
  workflow_dispatch:
    inputs:
      min_fit:
        description: "Lowest sheet fit score to import (1-5)"
        default: "1"
      max:
        description: "Most listings to add in this run"
        default: "250"
      dry_run:
        description: "Only report what would be added"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - run: python3 pipeline/sheet.py ingest --min-fit "${{ inputs.min_fit }}" --max "${{ inputs.max }}" ${{ inputs.dry_run && '--dry-run' || '' }}
